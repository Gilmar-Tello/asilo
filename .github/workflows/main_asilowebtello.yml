# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - asiloWebTello

on:
  push:
    branches:
      - 'main'
    # Solo se despliega el asilo cuando cambia su carpeta (o este mismo archivo)
    paths:
      - 'asilo_web/**'
      - '.github/workflows/main_asilowebtello.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # El repositorio tiene varios proyectos: aqui solo se construye asilo_web
      - name: npm install (solo asilo_web)
        working-directory: asilo_web
        run: |
          npm install --omit=dev
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: asilo_web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_88C931FADFA64839B9C22A3D3962661E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_44798254DE3B47DAAFCE4FCFCF678750 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_555F183A919F4DACAC0A33978A8539ED }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'asiloWebTello'
          slot-name: 'Production'
          package: .
          