# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - descuentoTello

on:
  push:
    branches:
      - 'main'
    # El microservicio vive en la raiz: solo se despliega si cambian SUS archivos
    paths:
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/main_descuentotello.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # El microservicio esta en la raiz junto a asilo_web y fundacion_web:
      # se arma una carpeta aparte con SOLO sus archivos y se instalan sus dependencias ahi
      - name: Preparar paquete del microservicio
        run: |
          mkdir paquete-descuento
          cp index.js package.json package-lock.json paquete-descuento/
          cd paquete-descuento
          npm install --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: paquete-descuento

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1548428E3015415FA513ACFF771171D6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9612C7F7A1E040348D7EC6B10EFE63CA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CF18B0AEDFF242389EE52C5B49F994DC }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'descuentoTello'
          slot-name: 'Production'
          package: .
          